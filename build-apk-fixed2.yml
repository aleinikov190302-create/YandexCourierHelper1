          mkdir -p project
          base64 -d /tmp/project.b64 > /tmp/project.zip
          unzip -q /tmp/project.zip -d project
          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts

      - name: Build debug APK
        working-directory: project
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YandexCourierHelper-4.0-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create GitHub release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG"             "project/app/build/outputs/apk/debug/app-debug.apk"             --title "Yandex Courier Helper 4.0 - APK"             --notes "Debug APK built automatically by GitHub Actions."
